interface:
  display_name: "Review and Test"
  short_description: "Validate completed changes with targeted tests, broader project checks, test-quality review, edge-case reasoning, and explicit PASS/FAIL/NOT RUN reporting"
  default_prompt: "Use $review-and-test to validate the current completed changes. Determine changed behavior, discover repository-defined verification commands, assess relevant tests and gaps, run targeted checks first, expand to broader checks when appropriate, investigate failures, and report PASS/FAIL/NOT RUN plus residual risks honestly."
policy:
  allow_implicit_invocation: true
